<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ナンバー自動読み取り 試作版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;background:#f0f4f8;color:#222;font-size:15px;min-height:100vh}
header{background:#1F5C99;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;font-weight:500}
header .badge{background:#FF6B35;color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.container{max-width:520px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #e0e8f0;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card h2{font-size:15px;font-weight:500;color:#333;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2 .icon{font-size:20px}

/* カメラエリア */
.camera-area{background:#f8fafc;border:2px dashed #c5d5e8;border-radius:10px;padding:24px;text-align:center;margin-bottom:14px;cursor:pointer;transition:all .2s}
.camera-area:hover{border-color:#1F5C99;background:#EEF5FB}
.camera-area .cam-icon{font-size:48px;margin-bottom:8px}
.camera-area p{color:#888;font-size:13px}
.preview-img{width:100%;border-radius:8px;margin-bottom:14px;display:none;max-height:280px;object-fit:cover}
input[type=file]{display:none}

/* ボタン */
.btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s}
.btn:active{opacity:.8}
.btn-camera{background:#1F5C99;color:#fff}
.btn-analyze{background:#2E7D32;color:#fff}
.btn-analyze:disabled{background:#aaa;cursor:not-allowed}
.btn-outline{background:#fff;color:#1F5C99;border:1px solid #1F5C99}
.btn-danger{background:#D32F2F;color:#fff}

/* 読み取り結果 */
.result-area{display:none}
.result-plate{background:#1a1a2e;color:#fff;border-radius:10px;padding:20px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.result-plate::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#1F5C99,#4CAF50)}
.plate-label{font-size:11px;color:#aaa;margin-bottom:6px;letter-spacing:1px}
.plate-number{font-size:32px;font-weight:500;letter-spacing:4px;color:#fff;margin-bottom:8px}
.plate-parts{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:10px}
.plate-part{background:rgba(255,255,255,0.1);border-radius:6px;padding:6px 4px;text-align:center}
.plate-part .part-label{font-size:10px;color:#aaa;display:block}
.plate-part .part-value{font-size:16px;color:#fff;font-weight:500}
.confidence{font-size:12px;color:#aaa;margin-top:6px}

/* 照合結果 */
.match-box{padding:14px;border-radius:8px;text-align:center;margin-bottom:12px}
.match-ok{background:#E8F5E9;border:1px solid #66BB6A}
.match-ok .match-label{color:#2E7D32;font-size:18px;font-weight:500}
.match-ng{background:#FFEBEE;border:1px solid #EF9A9A}
.match-ng .match-label{color:#C62828;font-size:18px;font-weight:500}
.match-sub{font-size:13px;color:#555;margin-top:4px}

/* ローディング */
.loading{display:none;text-align:center;padding:24px}
.spinner{width:40px;height:40px;border:3px solid #e0e0e0;border-top-color:#1F5C99;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:#888;font-size:13px}

/* 手動入力 */
.manual-section{border-top:1px solid #eee;margin-top:14px;padding-top:14px}
.manual-section h3{font-size:13px;color:#888;margin-bottom:10px}
.plate-grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 2fr;gap:6px;margin-bottom:10px}
.field-label{font-size:12px;color:#888;margin-bottom:3px;display:block}
input[type=text],input[type=number],textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:16px;font-family:inherit;background:#fff}
textarea{height:60px;resize:none;margin-bottom:8px;font-size:14px}

/* 履歴 */
.history-item{background:#f8fafc;border-radius:8px;padding:12px;margin-bottom:8px;border:1px solid #e8eef4;display:flex;align-items:center;gap:10px}
.history-thumb{width:50px;height:50px;object-fit:cover;border-radius:6px;flex-shrink:0}
.history-thumb-placeholder{width:50px;height:50px;background:#e0e8f0;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.history-info{flex:1}
.history-plate{font-size:15px;font-weight:500}
.history-meta{font-size:12px;color:#888;margin-top:2px}
.badge-ok{display:inline-block;background:#E8F5E9;color:#2E7D32;font-size:11px;padding:2px 8px;border-radius:10px;margin-top:4px}
.badge-ng{display:inline-block;background:#FFEBEE;color:#C62828;font-size:11px;padding:2px 8px;border-radius:10px;margin-top:4px}
.empty{text-align:center;padding:24px;color:#aaa;font-size:13px}
.delete-btn{background:none;border:none;color:#D32F2F;font-size:18px;cursor:pointer;padding:4px}

/* タブ */
.tabs{display:flex;background:#fff;border-radius:10px;padding:4px;margin-bottom:16px;border:1px solid #e0e8f0}
.tab{flex:1;padding:10px;border:none;background:none;border-radius:8px;font-size:14px;color:#666;cursor:pointer;font-family:inherit}
.tab.active{background:#1F5C99;color:#fff;font-weight:500}

.note{background:#FFF8E1;border:1px solid #FFE082;border-radius:8px;padding:12px;font-size:13px;color:#666;margin-bottom:14px}
.note strong{color:#F57F17}
</style>
</head>
<body>

<header>
  <h1>📷 ナンバー自動読み取り</h1>
  <span class="badge">試作版</span>
</header>

<div class="container">

  <div class="note">
    <strong>⚠ 試作版です</strong><br>
    読み取り精度は撮影条件（光・角度・汚れ）により変わります。必ず結果を確認してください。
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('scan')">📷 撮影・読み取り</button>
    <button class="tab" onclick="showTab('history')">📋 読み取り履歴</button>
  </div>

  <!-- 撮影・読み取りタブ -->
  <div id="tab-scan">

    <div class="card">
      <h2><span class="icon">📷</span>ナンバープレートを撮影</h2>

      <div class="camera-area" onclick="document.getElementById('camera-input').click()">
        <div class="cam-icon">📸</div>
        <p>タップして撮影する<br><span style="font-size:11px">または画像を選択</span></p>
      </div>
      <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="onImageSelected()">
      <img id="preview" class="preview-img">

      <button class="btn btn-analyze" id="analyze-btn" onclick="analyzeImage()" disabled>
        🔍 ナンバーを読み取る
      </button>
      <button class="btn btn-outline" onclick="resetAll()" id="reset-btn" style="display:none">
        🔄 もう一度撮影する
      </button>
    </div>

    <!-- ローディング -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>ナンバーを読み取り中...</p>
    </div>

    <!-- 読み取り結果 -->
    <div class="result-area" id="result-area">

      <div class="card">
        <h2><span class="icon">🔢</span>読み取り結果</h2>
        <div class="result-plate">
          <div class="plate-label">ナンバープレート</div>
          <div class="plate-number" id="result-full">—</div>
          <div class="plate-parts">
            <div class="plate-part"><span class="part-label">地名</span><span class="part-value" id="r-area">—</span></div>
            <div class="plate-part"><span class="part-label">分類</span><span class="part-value" id="r-class">—</span></div>
            <div class="plate-part"><span class="part-label">かな</span><span class="part-value" id="r-kana">—</span></div>
            <div class="plate-part"><span class="part-label">番号</span><span class="part-value" id="r-num">—</span></div>
          </div>
          <div class="confidence" id="confidence-text"></div>
        </div>

        <!-- 照合結果 -->
        <div id="match-result"></div>

        <!-- 修正欄 -->
        <div class="manual-section">
          <h3>読み取りが違う場合は修正してください</h3>
          <div class="plate-grid-4">
            <div><span class="field-label">地名</span><input type="text" id="fix-area" style="ime-mode:active"></div>
            <div><span class="field-label">分類番号</span><input type="number" id="fix-class" inputmode="numeric"></div>
            <div><span class="field-label">かな</span><input type="text" id="fix-kana" maxlength="1" style="text-align:center;ime-mode:active"></div>
            <div><span class="field-label">4桁</span><input type="number" id="fix-num" inputmode="numeric"></div>
          </div>
          <button class="btn btn-outline" onclick="applyFix()" style="margin-bottom:8px">✏️ 修正して照合</button>
        </div>
      </div>

      <div class="card">
        <h2><span class="icon">📝</span>無断駐車として記録</h2>
        <div><span class="field-label">場所</span><input type="text" id="rec-location" placeholder="例：月極区画付近" style="margin-bottom:10px"></div>
        <div><span class="field-label">車種・色（任意）</span><input type="text" id="rec-car" placeholder="例：白いプリウス" style="margin-bottom:10px"></div>
        <div><span class="field-label">メモ（任意）</span><textarea id="rec-note" placeholder="気になる点など"></textarea></div>
        <button class="btn btn-danger" onclick="recordViolation()">🚨 無断駐車として記録</button>
      </div>

    </div>

  </div>

  <!-- 履歴タブ -->
  <div id="tab-history" style="display:none">
    <div class="card">
      <h2><span class="icon">📋</span>読み取り履歴</h2>
      <div id="history-list"></div>
    </div>
  </div>

</div>

<script>
// データ
let staffList = JSON.parse(localStorage.getItem('staffList') || '[]');
let scanHistory = JSON.parse(localStorage.getItem('scanHistory') || '[]');
let currentPlate = { area:'', cls:'', kana:'', num:'', full:'' };
let currentImage = null;

function showTab(tab) {
  document.getElementById('tab-scan').style.display = tab === 'scan' ? 'block' : 'none';
  document.getElementById('tab-history').style.display = tab === 'history' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='scan')||(i===1&&tab==='history')));
  if (tab === 'history') renderHistory();
}

function onImageSelected() {
  const file = document.getElementById('camera-input').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    currentImage = e.target.result;
    const img = document.getElementById('preview');
    img.src = currentImage;
    img.style.display = 'block';
    document.getElementById('analyze-btn').disabled = false;
    document.getElementById('reset-btn').style.display = 'block';
    document.querySelector('.camera-area').style.display = 'none';
    document.getElementById('result-area').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

async function analyzeImage() {
  if (!currentImage) return;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('analyze-btn').disabled = true;

  try {
    const base64 = currentImage.split(',')[1];
    const mediaType = currentImage.split(';')[0].split(':')[1];

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: mediaType, data: base64 }
            },
            {
              type: 'text',
              text: `この画像の日本のナンバープレートを読み取ってください。
必ずJSON形式のみで回答してください。他のテキストは一切含めないでください。

{
  "area": "地名（例：沖縄）",
  "classification": "分類番号（例：500）",
  "kana": "ひらがな1文字（例：あ）",
  "number": "4桁番号（例：1234）",
  "confidence": "high/medium/low",
  "note": "読み取れない場合や不明な部分があれば記載"
}`
            }
          ]
        }]
      })
    });

    const data = await response.json();
    const text = data.content[0].text.trim();
    const clean = text.replace(/```json|```/g, '').trim();
    const result = JSON.parse(clean);

    currentPlate = {
      area: result.area || '',
      cls: result.classification || '',
      kana: result.kana || '',
      num: result.number || '',
      full: [result.area, result.classification, result.kana, result.number].filter(Boolean).join(' ')
    };

    document.getElementById('result-full').textContent = currentPlate.full || '読み取り失敗';
    document.getElementById('r-area').textContent = currentPlate.area || '?';
    document.getElementById('r-class').textContent = currentPlate.cls || '?';
    document.getElementById('r-kana').textContent = currentPlate.kana || '?';
    document.getElementById('r-num').textContent = currentPlate.num || '?';

    const conf = result.confidence;
    document.getElementById('confidence-text').textContent =
      conf === 'high' ? '✅ 読み取り精度：高' :
      conf === 'medium' ? '⚠️ 読み取り精度：中（確認推奨）' : '❌ 読み取り精度：低（要確認）';

    document.getElementById('fix-area').value = currentPlate.area;
    document.getElementById('fix-class').value = currentPlate.cls;
    document.getElementById('fix-kana').value = currentPlate.kana;
    document.getElementById('fix-num').value = currentPlate.num;

    checkMatch(currentPlate.full);

  } catch(e) {
    document.getElementById('result-full').textContent = '読み取りエラー';
    document.getElementById('confidence-text').textContent = 'もう一度試してください';
    console.error(e);
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('result-area').style.display = 'block';
  document.getElementById('analyze-btn').disabled = false;
}

function normPlate(p) {
  return p.replace(/\s/g,'').replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).toLowerCase();
}

function checkMatch(plate) {
  const box = document.getElementById('match-result');
  if (!plate) { box.innerHTML = ''; return; }
  const norm = normPlate(plate);
  const staff = staffList.find(s => normPlate(s.plate) === norm);
  if (staff) {
    box.innerHTML = `<div class="match-box match-ok">
      <div class="match-label">✅ 登録済み社員車両</div>
      <div class="match-sub">${staff.name}（${staff.tenant}）${staff.car}</div>
    </div>`;
  } else {
    box.innerHTML = `<div class="match-box match-ng">
      <div class="match-label">❌ 未登録車両</div>
      <div class="match-sub">社員登録されていません</div>
    </div>`;
  }
}

function applyFix() {
  const area = document.getElementById('fix-area').value.trim();
  const cls  = document.getElementById('fix-class').value.trim();
  const kana = document.getElementById('fix-kana').value.trim();
  const num  = document.getElementById('fix-num').value.trim();
  currentPlate = { area, cls, kana, num, full: [area,cls,kana,num].filter(Boolean).join(' ') };
  document.getElementById('result-full').textContent = currentPlate.full;
  document.getElementById('r-area').textContent = area || '?';
  document.getElementById('r-class').textContent = cls || '?';
  document.getElementById('r-kana').textContent = kana || '?';
  document.getElementById('r-num').textContent = num || '?';
  document.getElementById('confidence-text').textContent = '✏️ 手動修正済み';
  checkMatch(currentPlate.full);
}

function recordViolation() {
  if (!currentPlate.full) { alert('ナンバーが読み取れていません'); return; }
  const location = document.getElementById('rec-location').value.trim();
  const car      = document.getElementById('rec-car').value.trim();
  const note     = document.getElementById('rec-note').value.trim();

  const entry = {
    id: Date.now(),
    plate: currentPlate.full,
    car, location, note,
    image: currentImage,
    date: new Date().toISOString().split('T')[0],
    registeredAt: new Date().toLocaleString('ja-JP')
  };

  // メインアプリの違反リストにも追加
  let violationList = JSON.parse(localStorage.getItem('violationList') || '[]');
  violationList.unshift(entry);
  localStorage.setItem('violationList', JSON.stringify(violationList));

  // 履歴にも保存
  scanHistory.unshift({ ...entry, matched: !!staffList.find(s => normPlate(s.plate) === normPlate(currentPlate.full)) });
  localStorage.setItem('scanHistory', JSON.stringify(scanHistory.slice(0, 50)));

  alert('無断駐車として記録しました！');
  resetAll();
}

function resetAll() {
  currentImage = null;
  currentPlate = { area:'', cls:'', kana:'', num:'', full:'' };
  document.getElementById('preview').style.display = 'none';
  document.getElementById('preview').src = '';
  document.querySelector('.camera-area').style.display = 'block';
  document.getElementById('analyze-btn').disabled = true;
  document.getElementById('reset-btn').style.display = 'none';
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('camera-input').value = '';
  document.getElementById('rec-location').value = '';
  document.getElementById('rec-car').value = '';
  document.getElementById('rec-note').value = '';
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!scanHistory.length) { el.innerHTML = '<div class="empty">履歴はありません</div>'; return; }
  el.innerHTML = scanHistory.map(h => `
    <div class="history-item">
      ${h.image ? `<img src="${h.image}" class="history-thumb">` : '<div class="history-thumb-placeholder">🚗</div>'}
      <div class="history-info">
        <div class="history-plate">${h.plate}</div>
        <div class="history-meta">${h.date}　${h.location || '場所未記入'}</div>
        <span class="${h.matched ? 'badge-ok' : 'badge-ng'}">${h.matched ? '社員車両' : '無断駐車'}</span>
      </div>
      <button class="delete-btn" onclick="deleteHistory(${h.id})">🗑</button>
    </div>`).join('');
}

function deleteHistory(id) {
  if (!confirm('この履歴を削除しますか？')) return;
  scanHistory = scanHistory.filter(h => h.id !== id);
  localStorage.setItem('scanHistory', JSON.stringify(scanHistory));
  renderHistory();
}
</script>
</body>
</html>
